name: 번들 만들기와 올리기

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  toss:
    name: 토스 콘솔에 번들 올리기
    runs-on: ubuntu-latest
    env:
      AIT_API_KEY: ${{ secrets.AIT_API_KEY }}
      MEMO: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 번들(.ait) 만들기
        run: npm run build
      - name: 콘솔에 올리기
        if: ${{ env.AIT_API_KEY != '' }}
        run: npx ait deploy --api-key "$AIT_API_KEY" -m "${MEMO:0:900}"

  preview:
    name: 미리보기 올리기
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 미리보기 만들기(시험용 날짜 바꾸기 켜짐)
        env:
          VITE_PREVIEW: '1'
          PAGES_BASE: /${{ github.event.repository.name }}/
        run: npm run build:preview
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: pages
        uses: actions/deploy-pages@v4
